<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الجنرال للألعاب الإلكترونية - PS4 5.05 - 9.60</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    background-color: #000000; background-image: url('../image_3.png');
    background-repeat: no-repeat; background-position: center center;
    background-attachment: fixed; background-size: cover;
    color: #e6ebf2; font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column;
  }
  #brand {
    text-align: center; padding: 12px 16px;
    background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
  }
  #brand b {
    font-size: 16px; font-weight: 700; letter-spacing: 0.08em; color: #ffffff;
  }
  #wrap { padding: 16px 18px; flex: 1; display: flex; flex-direction: column; }
  #console {
    white-space: pre-wrap; font: 13px/1.5 Consolas, "Courier New", monospace;
    background: rgba(10, 12, 16, 0.65); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 10px; padding: 14px 16px;
    flex: 1; height: calc(100vh - 120px); overflow-y: auto; color: #d1d5db;
  }
</style>
<script>
  if (window.applicationCache && window.applicationCache.status === 0) {
    window.location.replace("cache.html");
  }
</script>
</head>
<body>

<div id="brand">
  <b>الجنرال للألعاب الإلكترونية: 0918846443</b>
</div>

<div id="wrap">
  <pre id="console"></pre>
</div>

<audio id="bg-music" loop autoplay preload="auto"><source src="../song.mp3" type="audio/mpeg"></audio>

<script>
  window.entrypoint672_result = 0;
  window.exploitsetup672_result = 0;
  var config_target = 0x0000;
  var outputConsole = document.getElementById("console");
  
  window.log = function (msg, color) {
    if (color === undefined) color = "#cccccc";
    outputConsole.innerHTML += '<span style="color:' + color + '">' + msg + '</span><br>';
  };

  window.getScriptES5 = function (source, callback) {
    var gs = document.createElement('script');
    gs.src = source;
    gs.onload = callback;
    gs.async = false;
    document.body.appendChild(gs);
  };

  window.checkPlatformIsSupported = function () {
    var userAgent = navigator.userAgent;
    var psRegex = /PlayStation (4|5)[ \/]([0-9]{1,2}\.[0-9]{2})/;
    var match = userAgent.match(psRegex);
    if (!match) return false;
    var device = match[1];
    var fwVersion = match[2];
    config_target = parseInt(fwVersion.replace('.', ''), 16);
    window.log("Firmware PS" + device + ": " + fwVersion + "\n");
    var supportedFW = {
      "4": ["5.05", "6.70", "6.71", "6.72", "7.00", "7.01", "7.02", "7.50", "7.51", "7.55", "8.00", "8.01", "8.03", "8.50", "8.52", "9.00", "9.03", "9.04", "9.50", "9.51", "9.60"]
    };
    return supportedFW[device] && supportedFW[device].indexOf(fwVersion) !== -1;
  };

  window.addEventListener('load', function () {
    outputConsole.textContent = "";
    try {
      if (!window.checkPlatformIsSupported()) {
        window.log("عذراً، هذا الإصدار غير مدعوم لهذه الصفحة", "red");
      } else {
        if (config_target === 0x505) {
          window.log("Starting 5.05 Exploit...");
          window.getScriptES5('505exploit.js', function () { setTimeout(exploit505, 3000); });
        } else {
          window.log("Starting main exploit...");
          window.getScriptES5('main.js', function () { setTimeout(doJailBreak, 1500); });
        }
      }
    } catch (error) {
      window.log("An error occurred: " + error, "red");
    }
  });
</script>

</body>
</html>
